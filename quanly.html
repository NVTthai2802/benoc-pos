<script>
(function () {
'use strict';
const { api, ui, esc, K, vnd, hhmm, ddmm, ddmmyyyy, startOfDay, addDays, dur, toLocalInput, errText, applyRounding, DEMO, DRINK_CATS, promoLive, promoWhen, DOW } = BN;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const COLORS = [['vang', 'Vàng'], ['cam', 'Cam'], ['hong', 'Hồng'], ['xanhla', 'Xanh lá'], ['xanhduong', 'Xanh dương'], ['tim', 'Tím'], ['nau', 'Nâu']];
const MODE = { up: 'làm tròn lên', down: 'làm tròn xuống', nearest: 'làm tròn gần nhất' };
/* Loại nhóm tuỳ chọn: tuỳ chọn đồ uống (upsize, chọn kem) và tuỳ chọn đồ ăn (topping, thêm mì) */
const OKIND = { do_uong: 'Đồ uống', do_an: 'Đồ ăn' };
const gKind = g => (g.kind === 'do_uong' ? 'do_uong' : 'do_an');
const isDrinkCat = c => !!c && (c.station === 'pha_che' || DRINK_CATS.test(c.name));
const choiceText = g => g.choices.map(c => c.name + (c.price_delta ? ' +' + K(c.price_delta) : '')).join(', ');
/* Hai mã QR gọi món: mỗi mã mở đúng một menu, đơn về đúng một quầy */
const QRS = [
  { key: 'an', query: '?menu=an', color: 'vang', title: 'Mã QR bếp nóng · menu Ăn vặt', desc: 'Dán ở khu bếp. Khách quét thấy cơm, mì, kimbap, đồ ăn vặt và nước uống của bếp. Đơn về màn hình bếp, bếp thu tiền.', screen: 'bep.html', screenName: 'bếp' },
  { key: 'tra', query: '?menu=tra', color: 'hong', title: 'Mã QR quầy pha chế · menu Trà · Cà phê', desc: 'Dán ở quầy pha chế. Khách quét thấy trà sữa, trà hoa quả, cà phê, matcha. Đơn về màn hình pha chế, quầy pha chế thu tiền.', screen: 'phache.html', screenName: 'pha chế' }
];
const PAY_STEPS = [[1, 'Không làm tròn (giữ số lẻ)'], [100, 'Làm tròn tới 100đ'], [500, 'Làm tròn tới 500đ'], [1000, 'Làm tròn tới 1.000đ']];
/* Ca/cài đặt có làm tròn giờ công không (round_minutes = 1 hoặc trống nghĩa là tính đúng từng phút) */
const isExact = r => !r.round_minutes || Number(r.round_minutes) === 1;
function ruleText(r) {
  return (isExact(r) ? 'tính đúng từng phút' : 'giờ công ' + MODE[r.round_mode] + ' theo ' + r.round_minutes + ' phút') + ', ' +
    (Number(r.pay_round) > 1 ? 'tiền làm tròn tới ' + vnd(r.pay_round) : 'tiền giữ số lẻ');
}
/* Diễn giải lương một ca đã kết thúc, ví dụ "3 giờ 52 phút × 25.000đ/giờ = 96.667đ → 97.000đ" */
function payLine(s) {
  const raw = (s.paid_minutes || 0) * (s.hourly_rate || 0) / 60;
  const time = isExact(s) ? dur(s.actual_minutes) : dur(s.actual_minutes) + ' → tính ' + dur(s.paid_minutes) + ' (' + MODE[s.round_mode] + ' ' + s.round_minutes + ' phút)';
  return time + ' × ' + vnd(s.hourly_rate) + '/giờ = ' + (Math.abs(raw - s.pay_amount) >= 0.5 ? vnd(raw) + ' → <b>' + vnd(s.pay_amount) + '</b>' : '<b>' + vnd(s.pay_amount) + '</b>');
}
const PAY = { tien_mat: 'Tiền mặt', chuyen_khoan: 'Chuyển khoản' };
const PAY_COLOR = { tien_mat: '#E2325C', chuyen_khoan: '#3A7FC2' };
const ICON_BOWL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-1 1-1.5 1-2.5M12 7c0-1 1-1.5 1-2.5M16 7c0-1 1-1.5 1-2.5"/></svg>';
const ICON_CUP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1.5 13h-9z"/><path d="M5 8h14M12 8l2-6"/></svg>';
const TABS = {
  owner: [['doanhthu', 'Doanh thu', 'hong'], ['menu', 'Menu', 'vang'], ['uudai', 'Ưu đãi', 'tim'], ['kho', 'Kho', 'xanhla'], ['nhanvien', 'Nhân viên', 'xanhduong'], ['chamcong', 'Chấm công', 'cam'], ['caidat', 'Cài đặt', 'nau']],
  staff: [['chamcong', 'Chấm công', 'cam'], ['kho', 'Kho', 'xanhla']]
};
const state = { session: null, tab: null, menuSub: 'mon', menuCat: 'all', menuQuery: '', groupQuery: '', promoQuery: '', stockQuery: '', stockSub: 'hang', packQuery: '', range: '7d', staffRange: 'month', shiftEmp: '' };

$('#demoNote').hidden = !DEMO;
BN.staff.requireLogin($('#app'), { title: 'Quản lý quán', onReady: s => { state.session = s; boot(); } });

const role = () => state.session.employee.role;
const isOwner = () => role() === 'owner';
const loadScript = src => new Promise((res, rej) => {
  const ex = document.querySelector('script[data-src="' + src + '"]');
  if (ex) { if (ex.dataset.ok) res(); else { ex.addEventListener('load', res); ex.addEventListener('error', rej); } return; }
  const s = document.createElement('script'); s.src = src; s.dataset.src = src;
  s.onload = () => { s.dataset.ok = '1'; res(); }; s.onerror = () => rej(new Error('Không tải được thư viện, kiểm tra mạng')); document.head.appendChild(s);
});
const confirmBox = (text, okLabel, id) => '<div class="inline-confirm" id="' + id + '" hidden><span>' + text + '</span><div class="row"><button class="btn btn-sm" style="background:var(--danger);color:#fff" type="button" data-yes>' + okLabel + '</button><button class="btn btn-sm btn-line" type="button" data-no>Thôi</button></div></div>';
function wireConfirm(sh, triggerSel, boxId, onYes) {
  const box = $('#' + boxId, sh), trg = $(triggerSel, sh); if (!box || !trg) return;
  trg.onclick = () => { box.hidden = false; box.scrollIntoView({ block: 'nearest' }); };
  $('[data-no]', box).onclick = () => { box.hidden = true; };
  $('[data-yes]', box).onclick = async e => { e.target.disabled = true; try { await onYes(); } catch (err) { ui.toast(errText(err)); e.target.disabled = false; } };
}

function boot() {
  if (role() === 'kitchen' || role() === 'bar') {
    const bar = role() === 'bar';
    $('#app').innerHTML = '<div class="wrap login"><div class="login-card"><h1>Bé Nốc</h1><p>Tài khoản ' + (bar ? 'máy pha chế dùng màn hình quầy pha chế' : 'máy bếp dùng màn hình bếp') + '.</p><a class="btn btn-block" href="' + (bar ? 'phache.html' : 'bep.html') + '">Mở màn hình ' + (bar ? 'quầy pha chế' : 'bếp') + '</a><button class="link" type="button" data-logout>Đăng xuất</button></div></div>';
    return;
  }
  const tabs = TABS[isOwner() ? 'owner' : 'staff'];
  const want = (location.hash || '').slice(1) || BN.store.get('qltab.' + BN.SLOT, '');
  state.tab = tabs.some(t => t[0] === want) ? want : tabs[0][0];
  $('#app').innerHTML = '<header class="topbar"><div class="topbar-in"><div class="brand"><b>Bé Nốc</b><span>Quản lý</span></div>' +
    '<a class="btn btn-sm" href="index.html?dat=giao' + (DEMO ? '&slot=' + encodeURIComponent(BN.SLOT) : '') + '">+ Đơn giao hàng</a>' +
    '<a class="btn btn-sm btn-line" href="bep.html">Bếp</a><a class="btn btn-sm btn-line" href="phache.html">Pha chế</a>' + BN.staff.whoChip(state.session) + '</div>' +
    '<nav class="nav" aria-label="Mục quản lý"><div class="nav-in">' + tabs.map(([k, t, c]) => '<button type="button" class="cc-' + c + '" data-tab="' + k + '">' + t + '</button>').join('') + '</div></nav></header>' +
    '<main class="page" id="main"></main>';
  $('.nav').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); });
  go(state.tab);
}
function go(tab) {
  state.tab = tab;
  try { history.replaceState(null, '', location.pathname + location.search + '#' + tab); } catch (e) { /* bỏ qua */ }
  BN.store.set('qltab.' + BN.SLOT, tab);
  $$('.nav [data-tab]').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'true' : 'false'));
  const main = $('#main'); main.onclick = null; main.onchange = null; main.innerHTML = '<p class="loading">Đang tải…</p>';
  ({ doanhthu: renderRevenue, menu: renderMenu, uudai: renderPromos, kho: renderStock, nhanvien: renderStaff, chamcong: renderClock, caidat: renderSettings })[tab](main)
    .catch(e => { main.innerHTML = '<p class="msg">' + esc(errText(e)) + '</p>'; });
}
const rerender = () => go(state.tab);

/* =====================================================================
   DOANH THU
   ===================================================================== */
function rangeOf(k) {
  const today = startOfDay(new Date());
  if (k === 'today') return { from: today, to: addDays(today, 1), label: 'Hôm nay' };
  if (k === '30d') return { from: addDays(today, -29), to: addDays(today, 1), label: '30 ngày qua' };
  if (k === 'month') return { from: new Date(today.getFullYear(), today.getMonth(), 1), to: addDays(today, 1), label: 'Tháng này' };
  return { from: addDays(today, -6), to: addDays(today, 1), label: '7 ngày qua' };
}
const short = n => n >= 1e6 ? (Math.round(n / 1e5) / 10).toString().replace('.', ',') + 'tr' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n);
/* Bước trục tròn (1, 2, 5 × 10^k) để các mốc là số chẵn như 1tr, 2tr, 3tr */
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); for (const f of [1, 2, 5, 10]) if (f * p >= raw) return f * p; return 10 * p; }

function barChart(buckets) {
  const W = 680, H = 230, pl = 46, pr = 8, pt = 14, pb = 28, iw = W - pl - pr, ih = H - pt - pb;
  const step = niceStep(Math.max(1, ...buckets.map(b => b.value)) / 4), max = step * 4;
  const n = buckets.length, slot = iw / n, bw = Math.max(3, Math.min(30, slot - 2)), y0 = pt + ih;
  const every = Math.ceil(n / 8);

/* Món của ưu đãi đang "Hết món" làm ưu đãi bị ẩn (giống get_promotions trong SQL) */
function promoBlocked(p) {
  const m = state.menuData, it = id => m && m.items.find(i => i.id === id), off = i => { const x = it(i.menu_item_id); return !x || !x.is_available; };
  const nm = list => list.map(i => (it(i.menu_item_id) || {}).name || 'món đã xoá').join(', ');
  if (p.kind === 'combo') { const bad = p.items.filter(i => i.part === 'combo' && off(i)); return bad.length ? 'Ẩn vì hết món: ' + nm(bad) : (p.items.some(i => i.part === 'combo') ? '' : 'Ẩn vì chưa có món'); }
  if (p.kind === 'giam_gia') { const g = p.items.filter(i => i.part === 'giam'); return g.some(i => !off(i)) ? '' : g.length ? 'Ẩn vì các món đều hết: ' + nm(g) : 'Ẩn vì chưa có món'; }
  const buy = p.items.filter(i => i.part === 'mua'), gift = p.items.filter(i => i.part === 'tang');
  if (!buy.some(i => !off(i))) return 'Ẩn vì món mua đều hết: ' + nm(buy);
  if (!p.gift_same && !p.gift_name && !gift.some(i => !off(i))) return 'Ẩn vì món tặng đều hết: ' + nm(gift);
  return '';
}
function promoState(p) {

function staffRangeOf(k) {
  const today = startOfDay(new Date());
  if (k === 'week') { const d = (today.getDay() + 6) % 7; return { from: addDays(today, -d), to: addDays(today, 1), label: 'Tuần này' }; }
  if (k === '30d') return { from: addDays(today, -29), to: addDays(today, 1), label: '30 ngày qua' };
  return { from: new Date(today.getFullYear(), today.getMonth(), 1), to: addDays(today, 1), label: 'Tháng này' };
}

async function renderClock(main) {
  const [open, mine, cfg] = await Promise.all([api.myOpenShift(), api.myShifts(30), api.settings()]);
  const monthStart = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  const month = mine.filter(s => new Date(s.check_in_at) >= monthStart && s.check_out_at);
  const mins = Math.floor(open ? (Date.now() - new Date(open.check_in_at)) / 60000 : 0);
  main.innerHTML = '<div class="ptitle"><h1>Chấm công</h1></div>' +
    '<section class="box cc-cam clock-card" id="clockCard">' + (open
      ? '<span class="state">Bạn đang trong ca</span><span>Vào lúc <b class="num">' + hhmm(open.check_in_at) + '</b> · đã làm <b class="num">' + dur(mins) + '</b></span><label class="btn filebtn" for="shot">Chụp ảnh ra ca<input type="file" accept="image/*" capture="user" id="shot"></label>'
      : '<span class="state">Bạn chưa vào ca</span><span class="muted">Chụp một ảnh mặt bạn tại quán để bắt đầu ca. Giờ được lấy theo máy chủ, không theo điện thoại.</span><label class="btn filebtn" for="shot">Chụp ảnh vào ca<input type="file" accept="image/*" capture="user" id="shot"></label>') +
    '<span class="small muted">Cách tính lương: ' + ruleText(cfg) + ' · ' + vnd(state.session.employee.hourly_rate || 0) + '/giờ</span><div id="shotArea"></div></section>' +
    '<div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="stat"><span>Ca tháng này</span><b class="num">' + month.length + '</b></div><div class="stat"><span>Giờ làm tháng này</span><b class="num">' + dur(month.reduce((s, x) => s + (x.paid_minutes || 0), 0)) + '</b></div><div class="stat"><span>Lương tháng này</span><b class="num">' + vnd(month.reduce((s, x) => s + (x.pay_amount || 0), 0)) + '</b></div></div>' +
    '<section class="box cc-vang"><h2 class="box-title"><span>Ca gần đây</span></h2>' + (mine.length ? '<ul class="list">' + mine.map(s => '<li><div class="lrow" style="grid-template-columns:1fr auto"><span class="lmain"><span class="lname num">' + ddmm(s.check_in_at) + ' · ' + hhmm(s.check_in_at) + ' – ' + (s.check_out_at ? hhmm(s.check_out_at) : 'đang làm') + '</span><span class="lsub">' + (s.check_out_at ? (isExact(s) ? 'Làm ' + dur(s.actual_minutes) : 'Thực tế ' + dur(s.actual_minutes) + ', tính ' + dur(s.paid_minutes)) : '') + (s.note ? ' · ' + esc(s.note) : '') + '</span></span><span class="lside"><b class="num">' + (s.check_out_at ? vnd(s.pay_amount) : '') + '</b>' + (s.paid_out_at ? '<span class="pill pill-ok">Đã nhận</span>' : s.check_out_at ? '<span class="pill pill-mute">Chưa nhận</span>' : '') + '</span></div></li>').join('') + '</ul>' : '<p class="empty">Chưa có ca nào.</p>') + '</section>';
  $('#shot', main).onchange = e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    const area = $('#shotArea', main);
    // Ảnh phải vừa chụp: ảnh lấy từ thư viện thường có thời điểm cũ
    if (f.lastModified && Date.now() - f.lastModified > 3 * 60e3) { area.innerHTML = '<p class="msg">Ảnh này không phải vừa chụp. Hãy bấm nút và chụp ảnh mới bằng camera.</p>'; return; }

    $('#shotOk', main).onclick = async ev => {
      ev.target.disabled = true; ev.target.textContent = 'Đang gửi…';
      try {
        if (open) {

          main.innerHTML = '<div class="ptitle"><h1>Chấm công</h1></div><section class="box cc-xanhla clock-card"><span class="state">Đã ra ca. Cảm ơn bạn!</span><span>Ca hôm nay: <b class="num">' + hhmm(s.check_in_at) + ' – ' + hhmm(s.check_out_at) + '</b>.</span><span>' + payLine(s) + '</span><span>Lương ca này: <b class="num" style="color:var(--red);font-size:22px">' + vnd(s.pay_amount) + '</b></span><button class="btn btn-line" type="button" id="back">Xong</button></section>';
          $('#back', main).onclick = rerender;
        } else { await api.checkIn(f); ui.toast('Đã vào ca lúc ' + hhmm(Date.now())); rerender(); }
      } catch (err) { const m = $('#shotMsg', main); m.textContent = errText(err); m.hidden = false; ev.target.disabled = false; ev.target.textContent = open ? 'Xác nhận ra ca' : 'Xác nhận vào ca'; }

    };

function wireBankBox(main, cfg) {
  const read = () => { const sel = $('#bkBank', main).value, other = sel === 'other', bk = BN.BANKS.find(x => x[0] === sel);
    return { bin: other ? $('#bkBin', main).value.replace(/\D/g, '') : sel, bank: other ? $('#bkName', main).value.trim() : bk[1], account: $('#bkAcc', main).value.replace(/[^0-9A-Za-z]/g, ''), holder: BN.qrInfo($('#bkHolder', main).value).slice(0, 50), note: $('#bkNote', main).value.trim() || BN.NOTE_DEFAULT }; };
  /* Ví dụ nội dung thật cho 3 kiểu đơn; ngân hàng chỉ nhận chữ không dấu, tối đa 25 ký tự */
  const EX = [['Ăn tại quán', { dine_type: 'tai_quan', queue_number: 15, customer_name: 'Minh', id: 'a1b2c3d4' }], ['Mang về', { dine_type: 'mang_ve', customer_name: 'Thảo Vy', id: '9f3e77aa' }], ['Giao hàng', { dine_type: 'giao_hang', customer_name: 'Lan', id: '5c0d1e2f' }]];
  const paintEx = () => { const tpl = $('#bkNote', main).value.trim() || BN.NOTE_DEFAULT, raw = t => BN.fold(t).toUpperCase().replace(/[^A-Z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
    $('#bkEx', main).innerHTML = EX.map(([k, o]) => { const full = raw(tpl.replace(/\{ban\}/gi, o.dine_type === 'giao_hang' ? 'GIAO' : o.dine_type === 'mang_ve' ? 'MV' : 'SO ' + o.queue_number).replace(/\{ten\}/gi, o.customer_name).replace(/\{ma\}/gi, o.id.slice(0, 4))), cut = full.length > 25;
      return '<div><span class="small muted">' + k + ':</span> <b class="num">' + esc(BN.qrNoteFor(o, tpl)) + '</b>' + (cut ? ' <span class="pill pill-red">dài quá, bị cắt ' + (full.length - 25) + ' ký tự</span>' : '') + '</div>'; }).join('') +
      '<p class="small muted" style="margin:2px 0 0">App ngân hàng chỉ nhận chữ không dấu, tối đa 25 ký tự. Tên khách giúp đối chiếu đúng đơn trong sao kê.</p>'; };
  let t = null;
  const draw = () => { clearTimeout(t); t = setTimeout(async () => {
    const b = read(), box = $('#bkQr', main); if (!box) return;
    if (!/^\d{6}$/.test(b.bin) || b.account.length < 4) { box.innerHTML = '<p class="small muted">Nhập đủ ngân hàng và số tài khoản để xem mã.</p>'; return; }
    const keep = Object.assign({}, BN.BANK); Object.assign(BN.BANK, b);
    try { const u = await BN.qrDataUrl(BN.vietQR(10000, BN.qrNoteFor({ dine_type: 'tai_quan', queue_number: 15, customer_name: 'Minh', id: 'a1b2c3d4' }, b.note)), 300); box.innerHTML = '<img src="' + u + '" alt="Mã VietQR thử">'; }
    catch (e) { box.innerHTML = '<p class="small muted">Không tạo được mã, kiểm tra mạng.</p>'; }
    finally { Object.assign(BN.BANK, keep); }
  }, 300); };
  $('#bkBank', main).onchange = () => { $('#bkOther', main).hidden = $('#bkBank', main).value !== 'other'; draw(); };
  $('#bkNote', main).oninput = () => { paintEx(); draw(); };
  $$('[data-tok]', main).forEach(b => b.onclick = () => {
    const inp = $('#bkNote', main);
    if (b.dataset.tok === 'reset') inp.value = BN.NOTE_DEFAULT;
    else { const a = inp.selectionStart != null && document.activeElement === inp ? inp.selectionStart : inp.value.length, v = inp.value; inp.value = (v.slice(0, a) + (a && v[a - 1] !== ' ' ? ' ' : '') + b.dataset.tok + ' ' + v.slice(a)).replace(/\s+/g, ' ').trim(); }
    paintEx(); draw();
  });
  paintEx();
  ['#bkBin', '#bkName', '#bkAcc', '#bkHolder'].forEach(id => { $(id, main).oninput = draw; });
  draw();
  $('#bkSave', main).onclick = async e => {
    const b = read(), m = $('#bkMsg', main); m.hidden = true;
    if (!/^\d{6}$/.test(b.bin)) { m.textContent = 'Mã BIN ngân hàng gồm 6 số.'; m.hidden = false; return; }
    if (!b.bank) { m.textContent = 'Nhập tên ngân hàng.'; m.hidden = false; return; }
    if (b.account.length < 4) { m.textContent = 'Số tài khoản chưa đúng.'; m.hidden = false; return; }
    e.target.disabled = true;
    try { await api.saveBank(b); Object.assign(BN.BANK, b); $('#bkHolder', main).value = b.holder; $('#bkNote', main).value = b.note; ui.toast('Đã lưu tài khoản ' + b.bank + ' · ' + b.account); }
    catch (err) { m.textContent = /column|bank_/i.test(err.message || '') ? 'Cần chạy file SQL cập nhật 18 trên Supabase trước.' : errText(err); m.hidden = false; }
    e.target.disabled = false;
  };
}

    '<label class="field" for="sBar">Số đơn quầy pha chế làm cùng lúc<input id="sBar" type="number" min="1" max="10" value="' + (cfg.bar_capacity || 2) + '"></label></div>' +
    '<p class="small muted" style="margin:0">Hai số này dùng để ước tính thời gian chờ báo cho khách.</p>' +
    '<p class="small muted" style="margin:0">Cách tính lương mới áp dụng cho các ca kết thúc từ lúc lưu. Ca cũ giữ nguyên cách tính lúc đó.</p>' +
    '<div class="row"><button class="btn" type="button" id="sSave">Lưu cài đặt</button></div></div></section>' +
    (BN.FEATURES.vietqr ? bankBoxHtml(cfg) : '') + // QR đang tắt ở quán thật thì ẩn luôn phần cài tài khoản
    QRS.map(q => '<section class="box cc-' + q.color + '"><h2 class="box-title"><span>' + q.title + '</span></h2><div class="row" style="align-items:flex-start;gap:18px"><div class="qr" id="qr-' + q.key + '"><p class="loading">Đang tạo mã…</p></div>' +
      '<div style="flex:1;min-width:220px;display:flex;flex-direction:column;gap:10px"><p style="margin:0">' + q.desc + '</p><label class="field" for="qUrl-' + q.key + '">Địa chỉ mã này mở ra<input id="qUrl-' + q.key + '" value="' + esc(orderUrl + q.query) + '"></label>' +
      (DEMO ? '<p class="small muted" style="margin:0">Bản xem thử: khi đưa trang lên mạng, mã sẽ tự trỏ tới địa chỉ thật.</p>' : '') +
      '<div class="row"><a class="btn btn-sm btn-line" href="index.html' + q.query + '" target="_blank">Mở menu này</a><a class="btn btn-sm btn-line" href="' + q.screen + '" target="_blank">Mở màn hình ' + q.screenName + '</a></div></div></div></section>').join('') +
    (DEMO ? '<section class="box"><h2 class="box-title">Dữ liệu xem thử</h2><p class="muted" style="margin-top:0">Đưa mọi thứ về như lúc đầu: menu, đơn, ca làm.</p><button class="btn btn-danger" type="button" id="reset">Xoá dữ liệu xem thử</button>' + confirmBox('Xoá toàn bộ thay đổi trong bản xem thử?', 'Xoá và tải lại', 'resetBox') + '</section>' : '');
  const readRule = () => ({ round_minutes: $('#sRoundOn', main).checked ? Number($('#sStep', main).value) : 1, round_mode: $('#sMode', main).value, pay_round: Number($('#sPay', main).value) });
  const ex = () => {
    const r = readRule(); $('#sRoundOpts', main).hidden = !$('#sRoundOn', main).checked;
    const shift = m => { const pm = applyRounding(m, r.round_minutes, r.round_mode); return Object.assign({ actual_minutes: m, paid_minutes: pm, hourly_rate: 25000, pay_amount: BN.roundMoney(pm * 25000 / 60, r.pay_round) }, r); };
    $('#sEx', main).innerHTML = 'Ví dụ với lương 25.000đ/giờ:<br>• ' + payLine(shift(232)) + '<br>• ' + payLine(shift(248));
  };
  ex(); ['#sRoundOn', '#sStep', '#sMode', '#sPay'].forEach(id => { $(id, main).onchange = ex; });
  $('#sSave', main).onclick = async e => {
    e.target.disabled = true;
    try { await api.saveSettings({ shop_name: $('#sName', main).value.trim() || 'Bé Nốc', round_minutes: readRule().round_minutes, round_mode: $('#sMode', main).value, pay_round: readRule().pay_round, kitchen_capacity: Math.max(1, Number($('#sCap', main).value) || 1), bar_capacity: Math.max(1, Number($('#sBar', main).value) || 1) }); ui.toast('Đã lưu cài đặt'); }
    catch (err) { ui.toast(errText(err)); }
    e.target.disabled = false;
  };
  if (BN.FEATURES.vietqr) wireBankBox(main, cfg);
  if ($('#reset', main)) {
    const box = $('#resetBox', main);
    $('#reset', main).onclick = () => { box.hidden = false; };
    $('[data-no]', box).onclick = () => { box.hidden = true; };
    $('[data-yes]', box).onclick = () => { api.demoReset(); location.reload(); };
  }
  const drawQr = async q => {
    const el = $('#qr-' + q.key, main);
    try {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js');
      el.innerHTML = ''; new window.QRCode(el, { text: $('#qUrl-' + q.key, main).value.trim() || orderUrl + q.query, width: 220, height: 220, colorDark: '#3B2A24', colorLight: '#ffffff', correctLevel: window.QRCode.CorrectLevel.M });
    } catch (err) { el.innerHTML = '<p class="msg">Không tạo được mã QR (cần mạng).</p>'; }
  };
  QRS.forEach(q => { drawQr(q); $('#qUrl-' + q.key, main).onchange = () => drawQr(q); });
}
})();
</script>
