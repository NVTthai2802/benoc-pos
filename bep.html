<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bếp Bé Nốc</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&family=Mali:wght@500;600;700&display=swap">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="staff.css">
<style>
/* Bố cục bếp: 3 cột theo trạng thái trên máy tính bảng; điện thoại chuyển thành 3 tab */
.clock { font: 800 22px/1 var(--f-head); color: var(--ink); }
.calls { display: flex; flex-direction: column; gap: 8px; padding-block: 10px 0; }
.call { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; background: var(--red); color: #fff; font-weight: 600; }
.call .grow { flex: 1; min-width: 0; }
.call b { font: 800 24px/1 var(--f-head); }
@media (prefers-reduced-motion: no-preference) { .call { animation: pulse 1.4s ease-in-out infinite; } }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(226, 50, 92, .25); } }
.call .btn { background: #fff; color: var(--red); }
.seg { display: none; gap: 6px; padding-block: 10px 0; }
.seg button { flex: 1; border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 6px; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { border-color: var(--cb); background: var(--ch); color: var(--ink); }
.seg .n { font: 800 18px/1 var(--f-head); margin-left: 4px; }
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding-block: 12px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { min-width: 0; }
.col-head { margin: 0 0 10px; font: 800 18px/1.2 var(--f-head); display: flex; align-items: center; gap: 8px; }
.col-head span.t { display: inline-block; background: var(--ch); border: 2px solid var(--cb); padding: 2px 12px; border-radius: 10px; }
.col-head .n { font: 800 20px/1 var(--f-head); color: var(--ink-2); }
.klist { display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 860px) {
  .seg { display: flex; }
  .cols { grid-template-columns: 1fr; }
  .col:not(.on) { display: none; }
  .col-head { display: none; }
}
.kc { background: var(--paper); border: 2px solid var(--cb); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.kc-top { display: grid; grid-template-columns: 76px 1fr auto; gap: 12px; align-items: center; }
.kc-who { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.kc-who b { font: 700 18px/1.2 var(--f-hand); overflow-wrap: anywhere; }
.kc-who span { font-size: 13px; color: var(--ink-2); }
.timer { text-align: right; font-size: 12px; color: var(--ink-2); font-weight: 600; }
.timer b { display: block; font: 800 24px/1 var(--f-head); color: var(--ink); }
.timer.warn b { color: var(--warn); } .timer.late b { color: var(--danger); }
.kc-items { list-style: none; margin: 0; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; background: var(--card); border-radius: 12px; }
.kc-items li { display: flex; gap: 8px; align-items: baseline; }
.kc-items .q { font: 800 18px/1.2 var(--f-head); color: var(--red); min-width: 30px; }
.kc-items .nm { font: 600 16px/1.35 var(--f-hand); }
.kc-items .op { display: block; font-size: 13px; color: var(--ink-2); }
.kc-items .in { display: block; font-size: 13px; font-weight: 600; color: var(--warn); }
.kc-note { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-weight: 600; font-size: 14px; }
.kc-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kc-total { margin-right: auto; font: 800 20px/1 var(--f-head); }
.panel { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: var(--card); border: 1.5px solid var(--line); }
.panel-title { margin: 0; font-weight: 600; }
.mins { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mins .small { flex-basis: 100%; }
.mins output { font: 800 34px/1 var(--f-head); color: var(--red); min-width: 64px; text-align: center; }
.change { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; }
.change b { font: 800 22px/1 var(--f-head); color: var(--ok); }
.cc-cho_nhan { --cb: #F0943A; --ch: #FFCF86; }
.cc-dang_lam { --cb: #65A6DC; --ch: #C6E2F7; }
.cc-da_ra_mon { --cb: #78B567; --ch: #CDE8BD; }
.col-empty { padding: 18px; border: 2px dashed var(--line); border-radius: 18px; text-align: center; color: var(--ink-2); }
</style>

<div class="demo-note" id="demoNote" hidden><div class="wrap">Bản xem thử. Mở <a href="index.html" target="_blank">trang khách</a> ở tab khác để đặt món, đơn sẽ hiện ở đây.</div></div>
<div id="app"><p class="wrap loading">Đang tải…</p></div>

<script src="config.js"></script>
<script src="seed.js"></script>
<script src="core.js"></script>
<script src="staff.js"></script>
<script>
(function () {
'use strict';
const { api, ui, esc, vnd, hhmm, dur, ago, errText, DEMO } = BN;
const $ = (s, r = document) => r.querySelector(s);
const COLS = [['cho_nhan', 'Chờ nhận'], ['dang_lam', 'Đang làm'], ['da_ra_mon', 'Chờ thanh toán']];
const state = { orders: [], panels: {}, col: null, sound: false, seen: null, seenCalls: null, session: null };
let audio = null, wakeLock = null;

$('#demoNote').hidden = !DEMO;
BN.staff.requireLogin($('#app'), { title: 'Màn hình bếp', onReady: s => { state.session = s; start(); } });

function start() {
  $('#app').innerHTML =
    '<header class="topbar"><div class="topbar-in"><div class="brand"><b>Bếp</b><span>Bé Nốc</span></div>' +
    '<span class="clock num" id="clock"></span>' +
    '<button class="btn btn-sm btn-line" type="button" id="soundBtn" aria-pressed="false">Bật chuông báo</button>' +
    (state.session.employee.role === 'owner' ? '<a class="btn btn-sm btn-line" href="quanly.html">Quản lý</a>' : '') +
    BN.staff.whoChip(state.session) + '</div></header>' +
    '<div class="wrap" style="max-width:none"><div class="calls" id="calls"></div><div class="seg" id="seg"></div></div>' +
    '<main class="cols" id="cols">' + COLS.map(([k, t]) => '<section class="col cc-' + k + '" data-col="' + k + '"><h2 class="col-head"><span class="t">' + t + '</span><span class="n num" id="n-' + k + '">0</span></h2><div class="klist" id="list-' + k + '"></div></section>').join('') + '</main>';
  $('#soundBtn').onclick = toggleSound;
  $('#cols').addEventListener('click', onAction);
  $('#calls').addEventListener('click', onCall);
  $('#seg').addEventListener('click', e => { const b = e.target.closest('[data-seg]'); if (b) { state.col = b.dataset.seg; render(); } });
  tick(); setInterval(tick, 1000 * 20);
  refresh();
  api.onKitchenChange(() => refresh());
  setInterval(refresh, DEMO ? 4000 : 10000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { refresh(); if (state.sound) lockScreen(); } });
}

function tick() { const c = $('#clock'); if (c) c.textContent = hhmm(Date.now()); if (state.orders.length) render(); }

let busy = false;
async function refresh() {
  if (busy) return; busy = true;
  try {
    state.orders = await api.kitchenOrders();
    const ids = new Set(state.orders.map(o => o.id)), calls = new Set(); state.orders.forEach(o => o.calls.forEach(c => calls.add(c.id)));
    if (state.seen) {
      const newOrders = state.orders.filter(o => !state.seen.has(o.id)).length;
      const newCalls = [...calls].filter(c => !state.seenCalls.has(c)).length;
      if (newOrders || newCalls) alertNew(newOrders ? 'Có ' + newOrders + ' đơn mới' : 'Khách gọi nhân viên');
    }
    state.seen = ids; state.seenCalls = calls;
    Object.keys(state.panels).forEach(id => { if (!ids.has(id)) delete state.panels[id]; });
    render();
  } catch (e) { ui.toast(errText(e)); }
  finally { busy = false; }
}

/* ---------- Vẽ màn hình ---------- */
function timerHtml(o) {
  const now = Date.now();
  if (o.status === 'cho_nhan') { const m = Math.floor((now - new Date(o.created_at)) / 60000); return '<div class="timer' + (m >= 3 ? ' warn' : '') + '">Đã chờ<b class="num">' + m + "'" + '</b></div>'; }
  if (o.status === 'dang_lam') {
    const left = Math.ceil((new Date(o.estimated_ready_at) - now) / 60000);
    return left >= 0 ? '<div class="timer">Còn<b class="num">' + left + "'" + '</b></div>' : '<div class="timer late">Trễ<b class="num">' + (-left) + "'" + '</b></div>';
  }
  return '<div class="timer">Ra món<b class="num">' + hhmm(o.served_at) + '</b></div>';
}
function itemsHtml(o) {
  return '<ul class="kc-items">' + o.items.map(i => '<li><span class="q num">' + i.qty + '×</span><span><span class="nm">' + esc(i.item_name) + '</span>' +
    ((i.options || []).length ? '<span class="op">' + esc(i.options.map(x => x.choice).join(' · ')) + '</span>' : '') +
    (i.note ? '<span class="in">' + esc(i.note) + '</span>' : '') + '</span></li>').join('') + '</ul>';
}
function panelHtml(o) {
  const p = state.panels[o.id]; if (!p) return '';
  if (p.kind === 'accept') {
    return '<div class="panel"><p class="panel-title">Báo khách khoảng bao lâu xong?</p>' +
      '<div class="mins"><button class="btn btn-line btn-sm" type="button" data-act="min" data-d="-5" data-id="' + o.id + '" aria-label="Bớt 5 phút">−5</button>' +
      '<output class="num">' + (p.minutes == null ? '…' : p.minutes + "'") + '</output>' +
      '<button class="btn btn-line btn-sm" type="button" data-act="min" data-d="5" data-id="' + o.id + '" aria-label="Thêm 5 phút">+5</button>' +
      '<span class="small muted">Gợi ý theo số đơn đang làm và thời gian nấu thực tế gần đây</span></div>' +
      '<div class="row"><button class="btn grow" type="button" data-act="accept-ok" data-id="' + o.id + '"' + (p.minutes == null ? ' disabled' : '') + '>Nhận đơn · ' + (p.minutes || '') + ' phút</button>' +
      '<button class="btn btn-line" type="button" data-act="close" data-id="' + o.id + '">Thôi</button></div></div>';
  }
  if (p.kind === 'pay') {
    const given = Number(p.given || 0), change = given - o.total;
    return '<div class="panel"><p class="panel-title">Thu ' + vnd(o.total) + '</p>' +
      '<div class="chips">' + [o.total, 50000, 100000, 200000, 500000].filter((v, i, a) => v >= o.total && a.indexOf(v) === i).map(v => '<button class="chipbtn" type="button" data-act="given" data-v="' + v + '" data-id="' + o.id + '" aria-pressed="' + (given === v) + '">' + (v === o.total ? 'Vừa đủ' : vnd(v)) + '</button>').join('') + '</div>' +
      (given ? '<div class="change"><span>Tiền thối</span><b class="num">' + (change >= 0 ? vnd(change) : 'Thiếu ' + vnd(-change)) + '</b></div>' : '') +
      '<div class="row"><button class="btn btn-ok grow" type="button" data-act="pay-ok" data-m="tien_mat" data-id="' + o.id + '">Tiền mặt</button>' +
      '<button class="btn grow" type="button" data-act="pay-ok" data-m="chuyen_khoan" data-id="' + o.id + '">Chuyển khoản</button>' +
      '<button class="btn btn-line" type="button" data-act="close" data-id="' + o.id + '">Thôi</button></div></div>';
  }
  if (p.kind === 'cancel') {
    return '<div class="panel"><p class="panel-title">Huỷ đơn số ' + o.queue_number + '? Đơn sẽ bị xoá, không tính doanh thu.</p>' +
      '<div class="row"><button class="btn btn-danger grow" type="button" data-act="cancel-ok" data-id="' + o.id + '">Huỷ đơn</button><button class="btn btn-line" type="button" data-act="close" data-id="' + o.id + '">Giữ lại</button></div></div>';
  }
  return '';
}
function actionsHtml(o) {
  if (state.panels[o.id]) return '';
  const id = o.id;
  if (o.status === 'cho_nhan') return '<button class="btn" type="button" data-act="accept" data-id="' + id + '">Nhận đơn</button><button class="btn btn-line btn-sm" type="button" data-act="cancel" data-id="' + id + '">Huỷ</button>';
  if (o.status === 'dang_lam') return '<button class="btn btn-line btn-sm" type="button" data-act="extend" data-id="' + id + '">+5 phút</button><button class="btn btn-ok" type="button" data-act="served" data-id="' + id + '">Ra món</button>';
  return '<button class="btn" type="button" data-act="pay" data-id="' + id + '">Thanh toán</button><button class="btn btn-line btn-sm" type="button" data-act="cancel" data-id="' + id + '">Huỷ</button>';
}
function cardHtml(o) {
  const count = o.items.reduce((s, i) => s + i.qty, 0);
  return '<article class="kc" data-order="' + o.id + '">' +
    '<div class="kc-top"><div class="qbox"><span>Số</span><b class="num">' + o.queue_number + '</b></div>' +
    '<div class="kc-who"><b>' + esc(o.customer_name) + '</b><span>' + (o.customer_phone ? esc(o.customer_phone) + ' · ' : '') + 'đặt lúc ' + hhmm(o.created_at) + ' · ' + count + ' món</span></div>' + timerHtml(o) + '</div>' +
    itemsHtml(o) + (o.note ? '<p class="kc-note">Ghi chú: ' + esc(o.note) + '</p>' : '') +
    '<div class="kc-foot"><span class="kc-total num">' + vnd(o.total) + '</span>' + actionsHtml(o) + '</div>' + panelHtml(o) + '</article>';
}
function render() {
  const by = { cho_nhan: [], dang_lam: [], da_ra_mon: [] };
  state.orders.forEach(o => by[o.status] && by[o.status].push(o));
  if (!state.col) state.col = by.cho_nhan.length || !by.dang_lam.length ? 'cho_nhan' : 'dang_lam';
  COLS.forEach(([k]) => {
    const list = $('#list-' + k); if (!list) return;
    $('#n-' + k).textContent = by[k].length;
    list.innerHTML = by[k].length ? by[k].map(cardHtml).join('') : '<p class="col-empty">' + ({ cho_nhan: 'Chưa có đơn mới', dang_lam: 'Không có đơn đang làm', da_ra_mon: 'Không có đơn chờ thanh toán' }[k]) + '</p>';
    document.querySelector('.col[data-col="' + k + '"]').classList.toggle('on', state.col === k);
  });
  $('#seg').innerHTML = COLS.map(([k, t]) => '<button type="button" class="cc-' + k + '" data-seg="' + k + '" aria-pressed="' + (state.col === k) + '">' + t + '<span class="n num">' + by[k].length + '</span></button>').join('');
  const calls = []; state.orders.forEach(o => o.calls.forEach(c => calls.push({ c, o })));
  $('#calls').innerHTML = calls.map(({ c, o }) => '<div class="call" role="alert"><b class="num">' + o.queue_number + '</b><span class="grow">' + esc(o.customer_name) + ' gọi nhân viên · ' + ago(c.created_at) + '</span><button class="btn btn-sm" type="button" data-call="' + c.id + '">Đã tới</button></div>').join('');
  document.title = (by.cho_nhan.length ? '(' + by.cho_nhan.length + ') ' : '') + 'Bếp Bé Nốc';
}

/* ---------- Thao tác ---------- */
/* follow: cột mà đơn chuyển sang. Trên điện thoại (chỉ thấy 1 cột), nếu cột đang xem
   hết đơn thì tự chuyển theo để người bếp không bị "mất" đơn vừa bấm. */
async function run(btn, fn, okMsg, follow) {
  if (btn) btn.disabled = true;
  try { await fn(); if (okMsg) ui.toast(okMsg); } catch (e) { ui.toast(errText(e)); follow = null; }
  await refresh();
  if (follow && !state.orders.some(o => o.status === state.col)) { state.col = follow; render(); }
}
async function onAction(e) {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id, o = state.orders.find(x => x.id === id); if (!o) return;
  switch (b.dataset.act) {
    case 'accept':
      state.panels[id] = { kind: 'accept', minutes: null }; render();
      try { state.panels[id].minutes = await api.suggestWait(id); } catch (err) { state.panels[id].minutes = 15; }
      render(); break;
    case 'min': { const p = state.panels[id]; p.minutes = Math.max(5, Math.min(90, (p.minutes || 15) + Number(b.dataset.d))); render(); break; }
    case 'accept-ok': { const m = state.panels[id].minutes; delete state.panels[id]; run(b, () => api.acceptOrder(id, m), 'Đã nhận đơn số ' + o.queue_number + ' · ' + m + ' phút', 'dang_lam'); break; }
    case 'extend': run(b, () => api.extendWait(id, 5), 'Đã báo khách thêm 5 phút'); break;
    case 'served': run(b, () => api.markServed(id), 'Số ' + o.queue_number + ' đã ra món', 'da_ra_mon'); break;
    case 'pay': state.panels[id] = { kind: 'pay', given: 0 }; render(); break;
    case 'given': state.panels[id].given = Number(b.dataset.v); render(); break;
    case 'pay-ok': { delete state.panels[id]; run(b, () => api.completePayment(id, b.dataset.m), 'Đã thu ' + vnd(o.total) + (b.dataset.m === 'tien_mat' ? ' tiền mặt' : ' chuyển khoản'), 'cho_nhan'); break; }
    case 'cancel': state.panels[id] = { kind: 'cancel' }; render(); break;
    case 'cancel-ok': delete state.panels[id]; run(b, () => api.cancelOrder(id), 'Đã huỷ đơn số ' + o.queue_number); break;
    case 'close': delete state.panels[id]; render(); break;
  }
}
function onCall(e) { const b = e.target.closest('[data-call]'); if (b) run(b, () => api.resolveCall(Number(b.dataset.call))); }

/* ---------- Chuông báo ---------- */
function toggleSound() {
  state.sound = !state.sound;
  const b = $('#soundBtn'); b.setAttribute('aria-pressed', state.sound); b.textContent = state.sound ? 'Chuông báo: Bật' : 'Bật chuông báo';
  b.className = 'btn btn-sm ' + (state.sound ? 'btn-ok' : 'btn-line');
  if (state.sound) { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); beep(); } catch (e) { /* không có âm thanh */ } lockScreen(); }
}
function beep() {
  if (!audio) return;
  [0, 0.22].forEach((t, i) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = i ? 1046 : 784; o.type = 'sine';
    g.gain.setValueAtTime(0.0001, audio.currentTime + t); g.gain.exponentialRampToValueAtTime(0.4, audio.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + t + 0.2);
    o.connect(g).connect(audio.destination); o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.22);
  });
}
function alertNew(msg) {
  ui.toast(msg);
  if (state.sound) { beep(); setTimeout(beep, 700); }
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}
async function lockScreen() { try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { /* máy không hỗ trợ giữ màn hình sáng */ } }
})();
</script>
