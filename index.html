<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gọi món Bé Nốc</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&family=Mali:wght@500;600;700&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
/* Trang khách: một cột như tờ menu; mỗi danh mục là một ô khung màu; giỏ hàng dính đáy màn hình */
.hero { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-block: 16px 4px; }
.hero-text { min-width: 0; }
.hero-menu { display: block; font: 800 22px/1 var(--f-head); color: var(--ink); letter-spacing: .02em; }
.hero-name { margin: 2px 0 0; font: 800 34px/1 var(--f-head); color: var(--red); letter-spacing: -.01em; }
.hero-name::after { content: ""; display: block; height: 6px; width: 78%; margin-top: 4px; border-radius: 0 0 60% 60% / 0 0 100% 100%; border-bottom: 3px solid var(--red); opacity: .55; }
.hero-tag { margin: 6px 0 0; font: 600 13px/1.4 var(--f-hand); color: var(--ink-2); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 2px dashed var(--red); background: var(--card); border-radius: 12px; padding: 6px 12px; font-weight: 600; font-size: 14px; white-space: nowrap; color: var(--ink); flex: none; margin-top: 4px; }
.chip b { font: 800 20px/1 var(--f-head); color: var(--red); }
.chip--warn { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); }

.menubar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1.5px dashed var(--line); }
/* Mỗi mã QR mở một menu (Ăn vặt của bếp / Trà · Cà phê của quầy pha chế); có đường dẫn nhỏ sang menu kia */
.other-menu { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 5px 12px; border-radius: 999px; border: 1.5px solid var(--red); color: var(--red); background: var(--card); font-weight: 600; font-size: 13px; text-decoration: none; }
.other-menu-end { display: flex; flex-direction: column; align-items: center; gap: 2px; margin: 28px auto 0; max-width: 420px; padding: 14px 16px; border-radius: 18px; border: 2px dashed var(--red); background: var(--card); color: var(--red); text-decoration: none; text-align: center; }
.other-menu-end b { font: 800 19px/1.2 var(--f-head); }
.other-menu-end span { font-size: 13px; color: var(--ink-2); }
.tabs { overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs-in { display: flex; gap: 6px; padding-block: 8px; width: max-content; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 672px) { .tabs-in { padding-left: calc((100vw - 640px) / 2 + 16px); } }
.tab { border: 1.5px solid transparent; background: transparent; color: var(--ink-2); padding: 5px 12px; border-radius: 999px; font: 600 14px/1.4 var(--f-body); white-space: nowrap; }
.tab[aria-current="true"] { background: var(--ch); border-color: var(--cb); color: var(--ink); }

/* Vé số thứ tự */
.ticket { position: relative; display: grid; grid-template-columns: 96px 1fr; margin-block: 14px 4px; background: var(--card); border-radius: 16px; border: 2px solid var(--red); }
.ticket::before, .ticket::after { content: ""; position: absolute; left: 87px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); border: 2px solid var(--red); }
.ticket::before { top: -10px; clip-path: inset(50% 0 0 0); } .ticket::after { bottom: -10px; clip-path: inset(0 0 50% 0); }
.tk-num { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 14px 8px; border-right: 2px dashed var(--line); text-align: center; }
.tk-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); font-weight: 600; }
.tk-num b { font: 800 46px/1 var(--f-head); color: var(--red); }
.tk-num input { width: 72px; border: 0; border-bottom: 2px solid var(--red); background: transparent; text-align: center; font: 800 40px/1.1 var(--f-head); color: var(--red); padding: 0; border-radius: 0; }
.tk-num input::placeholder { color: var(--line); }
.tk-body { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; min-width: 0; }
.tk-title { margin: 0; font-weight: 600; }
.tk-name { font: 700 22px/1.2 var(--f-hand); overflow-wrap: anywhere; }
.tk-hint { font-size: 13px; color: var(--ink-2); }
.tk-num--mv { color: var(--warn); background: var(--warn-soft); border-radius: 14px 0 0 14px; }
.tk-num--mv svg { width: 42px; height: 42px; }
.tk-num--mv .tk-label { color: var(--warn); font-weight: 800; font-size: 13px; }
.tk-links { display: flex; flex-wrap: wrap; gap: 4px 14px; }
/* Chọn ăn tại quán / mang về */
.ticket--pick { display: block; padding: 14px; }
.ticket--pick::before, .ticket--pick::after { display: none; }
.dp-title { margin: 0 0 10px; font: 700 18px/1.3 var(--f-head); text-align: center; }
.dp-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dp-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 8px 12px; border: 2px solid var(--line); border-radius: 14px; background: var(--paper); color: var(--ink); font: inherit; cursor: pointer; }
.dp-btn:hover, .dp-btn:focus-visible { border-color: var(--red); background: var(--red-soft); }
.dp-btn svg { width: 44px; height: 44px; color: var(--red); }
.dp-btn[data-dine="mang_ve"] svg { color: var(--warn); }
.dp-btn b { font: 700 17px/1.2 var(--f-head); }
.dp-btn span { font-size: 13px; color: var(--ink-2); }
.dine-seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dine-seg label { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); font-weight: 600; cursor: pointer; }
.dine-seg label:has(input:checked) { border-color: var(--red); background: var(--red-soft); }
.dine-seg input { accent-color: var(--red); margin: 0; }
.dine-seg svg { width: 20px; height: 20px; }
.dine-seg.invalid label { border-color: var(--warn); background: var(--warn-soft); }
#fQueue[hidden] + #fName { grid-column: 1 / -1; }

.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; margin-block: 10px 0; padding: 12px 14px; border: 2px solid var(--red); border-radius: 14px; background: var(--red-soft); color: var(--ink); text-align: left; font-weight: 600; }
.banner span:last-child { white-space: nowrap; color: var(--red); }

/* Danh mục kiểu ô khung trên menu giấy */
.cat { position: relative; margin-top: 30px; border: 2px solid var(--cb); border-radius: 20px; background: var(--paper); padding: 0 14px 4px; scroll-margin-top: 70px; }
.cat-title { margin: -17px 0 2px; font: 800 20px/1.3 var(--f-head); text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.cat-title span { display: inline-block; background: var(--ch); padding: 2px 14px; border-radius: 12px; border: 2px solid var(--cb); }
.items { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding-block: 12px; border-bottom: 1.5px dashed var(--line); }
.item:last-child { border-bottom: 0; }
.item-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; border: 0; background: none; padding: 0; text-align: left; color: var(--ink); }
.item-name { font: 600 16px/1.35 var(--f-hand); overflow-wrap: anywhere; }
.item-desc { font-size: 13px; color: var(--ink-2); }
.item-opts { font-size: 12px; color: var(--ink-2); }
.item-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.item-price { font: 700 17px/1 var(--f-hand); color: var(--red); white-space: nowrap; }
.add { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--red); background: var(--card); color: var(--red); display: grid; place-items: center; font: 800 16px/1 var(--f-head); padding: 0; }
.add--on { background: var(--red); color: var(--red-ink); }
.add svg { width: 18px; height: 18px; }
.thumb-btn { border: 0; background: none; padding: 0; }
.menu-end { text-align: center; color: var(--ink-2); font: 600 14px/1.5 var(--f-hand); padding-block: 28px 120px; }

.cartbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-top: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: linear-gradient(to top, var(--bg) 70%, rgba(251, 241, 223, 0)); }
.cartbar .btn { width: 100%; max-width: 608px; margin: 0 auto; display: flex; justify-content: space-between; box-shadow: var(--shadow); min-height: 54px; padding-inline: 18px; }
.cartbar .btn b { font: 800 19px/1 var(--f-head); }

/* Bảng chọn món */
.sh-img { margin: -12px calc(-1 * max(18px, env(safe-area-inset-left, 0px))) 0; background: var(--paper); display: grid; place-items: center; max-height: 260px; overflow: hidden; }
.sh-img img { width: 100%; max-height: 260px; object-fit: contain; display: block; }
.og { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.og legend { padding: 0; margin-bottom: 6px; font-weight: 600; font-size: 16px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.og-rule { font-size: 12px; font-weight: 500; color: var(--ink-2); }
.og-rule--req { color: var(--red); }
.og-err { color: var(--warn); font-size: 13px; font-weight: 600; }
.choice { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); cursor: pointer; background: var(--card); }
.choice + .choice { margin-top: 6px; }
.choice:has(input:checked) { border-color: var(--red); background: var(--red-soft); }
.choice input { width: 20px; height: 20px; accent-color: var(--red); margin: 0; flex: none; }
.choice-name { flex: 1; min-width: 0; }
.choice-price { color: var(--ink-2); font-size: 14px; white-space: nowrap; }
.og--bad .choice { border-color: var(--warn); }
/* Lựa chọn có hình (lượng đường, lượng đá): 3 ô ngang */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tiles .choice + .choice { margin-top: 0; }
.tiles--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.og--size .lv-ico { color: var(--ink); }
.og--size .choice:has(input:checked) .lv-ico { color: var(--red); }
.item-price--ml { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 15px; }
.item-price--ml small { font: 700 11px/1 var(--f-body); color: var(--ink-2); margin-right: 2px; }
.choice--tile { position: relative; flex-direction: column; justify-content: flex-start; gap: 2px; padding: 8px 4px 10px; text-align: center; }
.choice--tile input { position: absolute; opacity: 0; pointer-events: none; }
.choice--tile:has(input:focus-visible) { outline: 3px solid var(--red); outline-offset: 2px; }
.choice--tile .choice-name { flex: none; font-size: 14px; font-weight: 600; line-height: 1.25; }
.lv-ico { display: block; width: 60px; height: 60px; }
.lv-ico svg { display: block; width: 100%; height: 100%; }

/* Giỏ hàng */
.lines { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.line { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding-block: 12px; border-bottom: 1.5px dashed var(--line); }
.line-name { font: 600 16px/1.35 var(--f-hand); min-width: 0; overflow-wrap: anywhere; }
.line-sub { grid-column: 1; font-size: 13px; color: var(--ink-2); }
.line-price { text-align: right; font-weight: 600; }
.line .stepper { grid-column: 2; justify-self: end; }
.sum { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; }
.sum b { font: 800 26px/1 var(--f-head); color: var(--red); }
.who { display: grid; grid-template-columns: 110px 1fr; gap: 12px; }
.who .wide { grid-column: 1 / -1; }
.dup { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: 14px; }
.dup p { margin: 0; }

/* Trạng thái đơn */
.st-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 18px; }
.st-head h1 { margin: 0; font: 800 26px/1.2 var(--f-head); }
.oc { margin-block: 14px; background: var(--paper); border: 2px solid var(--red); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.oc-top { display: grid; grid-template-columns: 84px 1fr; gap: 14px; align-items: center; }
.oc-state { min-width: 0; }
.oc-state h2 { margin: 0; font: 700 21px/1.25 var(--f-head); text-wrap: balance; }
.oc-state p { margin: 2px 0 0; color: var(--ink-2); font-size: 14px; }
.oc-paid { margin: 8px 0 0; padding: 6px 10px; border-radius: 10px; background: var(--ok-soft); color: var(--ok); font-weight: 600; font-size: 14px; }
.eta { color: var(--ink) !important; font-size: 15px !important; }
.eta b { font: 800 30px/1 var(--f-head); color: var(--red); margin-right: 4px; }
.oc--da_ra_mon .qbox { border-style: solid; background: var(--red-soft); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.steps li { position: relative; padding-top: 12px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.steps li::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px; border-radius: 6px; background: var(--line); }
.steps li.done::before { background: var(--red); }
.steps li.now { color: var(--red); }
.steps li.now::before { background: linear-gradient(90deg, var(--red) 50%, var(--red-soft) 50%); background-size: 200% 100%; }
@media (prefers-reduced-motion: no-preference) { .steps li.now::before { animation: slide 1.6s linear infinite; } }
@keyframes slide { from { background-position: 100% 0; } to { background-position: 0 0; } }
.oc-items summary { cursor: pointer; font-weight: 600; }
.oc-items ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.oc-items li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 14px; }
.oc-items .line-sub { font-size: 12px; }
.oc-note { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--card); font-size: 14px; }
.parts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.parts li { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding: 8px 12px; border-radius: 10px; background: var(--card); font-size: 14px; }
.parts b { font-weight: 600; }
.parts .pst { font-weight: 600; text-align: right; }
.pst-cho_nhan { color: var(--warn); } .pst-dang_lam { color: #1E5A8C; } .pst-da_ra_mon { color: var(--ok); }
.oc--paid { flex-direction: row; align-items: center; gap: 14px; border-color: var(--ok); }
.oc--paid .qbox { border-color: var(--ok); width: 84px; flex: none; }
.oc--paid .qbox b { color: var(--ok); }
.oc--paid h2 { margin: 0; font: 700 20px/1.2 var(--f-head); color: var(--ok); }
.oc--paid p { margin: 2px 0 6px; color: var(--ink-2); font-size: 14px; }
.st-foot { color: var(--ink-2); font-size: 13px; text-align: center; padding-block: 8px 40px; }
</style>

<div class="demo-note" id="demoNote" hidden><div class="wrap">Bản xem thử, chưa nối với quán. Mở <a href="bep.html" target="_blank">màn hình bếp</a> ở tab khác để nhận đơn, hoặc vào <a href="quanly.html" target="_blank">trang quản lý</a>.</div></div>

<header class="wrap hero">
  <div class="hero-text"><span class="hero-menu">MENU</span><h1 class="hero-name">BÉ NỐC ĂN VẶT</h1><p class="hero-tag" id="heroTag">Ăn ngon · Giá xinh · Ship nhanh</p><a class="other-menu" id="otherTop" hidden></a></div>
  <button class="chip chip--warn" id="chip" type="button">Chưa có số</button>
</header>

<div class="menubar" id="tabs">
  <nav class="tabs" aria-label="Danh mục món"><div class="tabs-in" id="tabsIn"></div></nav>
</div>

<main id="menuView">
  <div class="wrap">
    <section class="ticket" id="ticket" aria-label="Số thứ tự của bạn"></section>
    <div id="banner"></div>
    <div id="menuList"><p class="loading">Đang tải menu…</p></div>
    <a class="other-menu-end" id="otherEnd" hidden></a>
    <p class="menu-end">Cảm ơn bạn nhiều · Bé Nốc luôn bên bạn</p>
  </div>
</main>

<main id="statusView" hidden><div class="wrap" id="statusIn"></div></main>

<div class="cartbar" id="cartBar" hidden><button class="btn" id="cartBtn" type="button"></button></div>

<script src="config.js"></script>
<script src="seed.js"></script>
<script src="core.js"></script>
<script>
(function () {
'use strict';
const { api, ui, store, esc, K, vnd, hhmm, errText, ERR, DEMO, CONFIG, DRINK_CATS, ICON_BAG, qboxHtml, orderLabel, sizeGroup } = BN;
/* Giá size L của món có chọn size (null nếu món chỉ có 1 giá) */
const priceL = it => { const g = sizeGroup(it), L = g && g.choices.find(c => /^size l$/i.test(c.name)); return L ? it.price + L.price : null; };
/* Hình ly: M nhỏ, L to, chữ ở giữa */
function cupIcon(letter) {
  const big = letter === 'L', w = big ? 30 : 24, h = big ? 42 : 32, x0 = (60 - w) / 2, y0 = 56 - h;
  return '<svg viewBox="0 0 60 60" aria-hidden="true"><path d="M' + (x0 - 3) + ' ' + y0 + 'h' + (w + 6) + '" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>' +
    '<path d="M' + x0 + ' ' + (y0 + 2) + 'L' + (x0 + 3) + ' 56h' + (w - 6) + 'L' + (x0 + w) + ' ' + (y0 + 2) + 'z" fill="var(--red-soft)" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>' +
    '<path d="M' + (x0 + w - 6) + ' ' + y0 + 'l6 -' + (big ? 12 : 9) + '" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>' +
    '<text x="30" y="' + (y0 + h / 2 + 6) + '" text-anchor="middle" font-size="' + (big ? 17 : 14) + '" font-weight="800" fill="currentColor" font-family="system-ui,sans-serif">' + letter + '</text></svg>';
}
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const ICON = {
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  bowl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-1 1-1.5 1-2.5M12 7c0-1 1-1.5 1-2.5M16 7c0-1 1-1.5 1-2.5"/></svg>',
  cup: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1.5 13h-9z"/><path d="M5 8h14M12 8l2-6"/><circle cx="10" cy="17" r=".8"/><circle cx="13.5" cy="15" r=".8"/></svg>'
};

const state = {
  menu: [], items: new Map(), itemCat: new Map(),
  info: Object.assign({ queue: '', name: '', phone: '', dine: '', dineAt: 0 }, store.get('info', {})),
  cart: [], cartNote: '',
  orders: store.get(DEMO ? 'demo.orders' : 'orders', []),
  orderData: {}, editingInfo: false, view: 'menu',
  // ?menu=tra (mã QR quầy pha chế) → menu Trà · Cà phê; còn lại (?menu=an hoặc không có) → menu Ăn vặt của bếp
  // ?dat=giao → chủ quán / nhân viên tạo đơn giao hàng (khách nhắn Facebook, gọi điện): đủ cả đồ ăn và đồ uống
  kind: BN.PARAMS.get('dat') === 'giao' ? 'giao' : BN.PARAMS.get('menu') === 'tra' ? 'pha_che' : 'bep',
  staff: null, giao: { name: '', phone: '', address: '', time: '', paid: false }
};
const GIAO = state.kind === 'giao';
if (GIAO) state.orders = []; // trang tạo đơn không theo dõi đơn như khách
const MENU = {
  bep: { hero: 'BÉ NỐC ĂN VẶT', tag: 'Ăn ngon · Giá xinh · Ship nhanh', query: '?menu=an', link: 'Ăn vặt', linkDesc: 'Cơm trộn · Mì trộn · Kimbap · Đồ ăn vặt' },
  pha_che: { hero: 'BÉ NỐC TRÀ NGON', tag: 'Trà ngon · Vị thật · Giá yêu', query: '?menu=tra', link: 'Trà · Cà phê', linkDesc: 'Trà sữa · Trà hoa quả · Cà phê · Matcha' },
  giao: { hero: 'ĐƠN GIAO HÀNG', tag: 'Tích món khách nhắn qua Facebook / điện thoại', query: '?dat=giao', link: '', linkDesc: '' }
};
const OTHER_KIND = state.kind === 'bep' ? 'pha_che' : 'bep';
state.cart = store.get('cart.' + state.kind, []);
state.cartNote = store.get('cartNote.' + state.kind, '');
const saveInfo = () => store.set('info', state.info);
const saveCart = () => { store.set('cart.' + state.kind, state.cart); store.set('cartNote.' + state.kind, state.cartNote); };
const saveOrders = () => { if (!GIAO) store.set(DEMO ? 'demo.orders' : 'orders', state.orders); };

function showView(v) {
  state.view = v;
  $('#menuView').hidden = v !== 'menu'; $('#statusView').hidden = v !== 'status'; $('#tabs').hidden = v !== 'menu';
  renderCartBar(); window.scrollTo(0, 0);
  if (v === 'menu') { $$('.tab').forEach((t, i) => t.setAttribute('aria-current', i === 0 ? 'true' : 'false')); $('.tabs').scrollLeft = 0; }
  if (v === 'status') renderStatus(); else renderBanner();
}

/* ---------- Ảnh món ---------- */
function thumbHtml(it, size) {
  const cat = state.itemCat.get(it.id);
  const icon = cat && DRINK_CATS.test(cat.name) ? ICON.cup : ICON.bowl;
  return '<span class="thumb"' + (size ? ' style="width:' + size + 'px;height:' + size + 'px"' : '') + '>' +
    (it.image_path ? '<img src="' + esc(it.image_path) + '" alt="" loading="lazy">' : icon) + '</span>';
}

/* ---------- Vé số thứ tự ---------- */
const queueNum = () => parseInt(state.info.queue, 10);
/* Ăn tại quán / mang về. Hỏi lại nếu lần chọn trước đã quá 4 giờ (khách quay lại hôm khác). */
const DINE_TTL = 4 * 3600e3;
const dineMode = () => GIAO ? 'giao_hang' : (state.info.dine && Date.now() - (state.info.dineAt || 0) < DINE_TTL) ? state.info.dine : '';
const isTake = () => dineMode() === 'mang_ve';
function setDine(d) { state.info.dine = d; state.info.dineAt = Date.now(); saveInfo(); }
const infoReady = () => !!dineMode() && state.info.name.trim() !== '' && (isTake() || queueNum() > 0);
const dinePickHtml = () => '<p class="dp-title">Bạn ăn tại quán hay mang về?</p><div class="dp-btns">' +
  '<button class="dp-btn" type="button" data-dine="tai_quan">' + ICON.bowl + '<b>Ăn tại quán</b><span>Lấy thẻ số ở quầy</span></button>' +
  '<button class="dp-btn" type="button" data-dine="mang_ve">' + ICON_BAG + '<b>Mang về</b><span>Không cần thẻ số</span></button></div>';
/* Chưa chọn ăn tại quán / mang về thì hỏi trước, chọn xong mới làm tiếp (thêm món, mở món…) */
function needDine(then) {
  if (dineMode()) { then(); return; }
  ui.sheet(ui.head('Trước khi chọn món') + '<div class="sh-body">' + dinePickHtml() + '</div>', sh => {
    sh.addEventListener('click', e => { const b = e.target.closest('[data-dine]'); if (!b) return; setDine(b.dataset.dine); ui.close(); renderTicket(); then(); });
  });
}
function renderChip() {
  const c = $('#chip');
  if (GIAO) { c.className = 'chip'; c.textContent = 'Giao hàng'; c.removeAttribute('aria-label'); return; }
  if (!dineMode()) { c.className = 'chip chip--warn'; c.textContent = 'Ăn ở đây hay mang về?'; c.setAttribute('aria-label', 'Chưa chọn ăn tại quán hay mang về, bấm để chọn'); }
  else if (isTake()) { c.className = 'chip'; c.innerHTML = 'Mang về'; c.setAttribute('aria-label', 'Đơn mang về, bấm để sửa'); }
  else if (queueNum() > 0) { c.className = 'chip'; c.innerHTML = 'Số <b class="num">' + esc(queueNum()) + '</b>'; c.setAttribute('aria-label', 'Số thứ tự ' + queueNum() + ', bấm để sửa'); }
  else { c.className = 'chip chip--warn'; c.textContent = 'Chưa có số'; c.setAttribute('aria-label', 'Chưa nhập số thứ tự, bấm để nhập'); }
}
function renderTicket() {
  const el = $('#ticket'); renderChip();
  el.className = 'ticket';
  if (GIAO) {
    el.className = 'ticket ticket--pick'; el.onclick = null; el.setAttribute('aria-label', 'Tạo đơn giao hàng');
    el.innerHTML = state.staff === false
      ? '<p class="dp-title">Cần đăng nhập trước</p><p style="margin:0 0 10px;text-align:center">Trang này để chủ quán / nhân viên tạo đơn giao hàng. Đăng nhập ở trang Quản lý rồi quay lại.</p><a class="btn btn-block" href="quanly.html">Mở trang Quản lý để đăng nhập</a>'
      : '<p class="dp-title">Đơn giao hàng</p><p style="margin:0;text-align:center" class="muted">Tích các món khách nhắn (đồ ăn và đồ uống chung một đơn), rồi bấm <b>Xem giỏ</b> để nhập tên, địa chỉ, giờ giao.' + (state.staff ? '<br><span class="small">Đang đăng nhập: ' + esc(state.staff.full_name) + ' · <a href="quanly.html">về trang Quản lý</a></span>' : '') + '</p>';
    return;
  }
  if (!dineMode()) {
    el.className = 'ticket ticket--pick'; el.setAttribute('aria-label', 'Ăn tại quán hay mang về');
    el.innerHTML = dinePickHtml();
    el.onclick = e => { const b = e.target.closest('[data-dine]'); if (!b) return; setDine(b.dataset.dine); state.editingInfo = !infoReady(); renderTicket(); };
    return;
  }
  el.onclick = null; el.setAttribute('aria-label', isTake() ? 'Đơn mang về' : 'Số thứ tự của bạn');
  const switchLink = '<button class="link" type="button" id="tkSwitch">' + (isTake() ? 'Đổi sang ăn tại quán' : 'Đổi sang mang về') + '</button>';
  const wireSwitch = () => { $('#tkSwitch').onclick = () => { setDine(isTake() ? 'tai_quan' : 'mang_ve'); state.editingInfo = !infoReady(); renderTicket(); renderChip(); }; };
  if (isTake()) {
    const head = '<div class="tk-num tk-num--mv">' + ICON_BAG + '<span class="tk-label">Mang về</span></div>';
    if (infoReady() && !state.editingInfo) {
      el.innerHTML = head + '<div class="tk-body"><span class="tk-name">' + esc(state.info.name) + '</span><span class="tk-hint">Món xong quán sẽ gọi tên bạn ra quầy nhận. Không cần lấy thẻ số.</span>' +
        '<div class="tk-links"><button class="link" type="button" id="tkEdit">Sửa tên</button>' + switchLink + '</div></div>';
      $('#tkEdit').onclick = () => { state.editingInfo = true; renderTicket(); $('#inName').focus(); };
      wireSwitch(); return;
    }
    el.innerHTML = head + '<div class="tk-body"><p class="tk-title">Đơn mang về: chỉ cần tên của bạn, không cần thẻ số.</p>' +
      '<label class="field" for="inName">Tên của bạn <input id="inName" maxlength="40" autocomplete="given-name" placeholder="Để quán gọi khi món xong" value="' + esc(state.info.name) + '"></label>' +
      '<p class="msg" id="tkMsg" hidden></p>' +
      '<div class="row"><button class="btn btn-sm" type="button" id="tkSave">Lưu</button></div><div class="tk-links">' + switchLink + '</div></div>';
    const n = $('#inName');
    n.oninput = () => { state.info.name = n.value; saveInfo(); };
    $('#tkSave').onclick = () => {
      const m = $('#tkMsg');
      if (!state.info.name.trim()) { m.textContent = ERR.MISSING_NAME; m.hidden = false; n.focus(); return; }
      state.editingInfo = false; renderTicket(); ui.toast('Đã lưu: mang về');
    };
    wireSwitch(); return;
  }
  if (infoReady() && !state.editingInfo) {
    el.innerHTML = '<div class="tk-num"><span class="tk-label">Số của bạn</span><b class="num">' + esc(queueNum()) + '</b></div>' +
      '<div class="tk-body"><span class="tk-name">' + esc(state.info.name) + '</span><span class="tk-hint">Nhân viên sẽ mang món tới chỗ có thẻ số này.</span>' +
      '<div class="tk-links"><button class="link" type="button" id="tkEdit">Sửa số hoặc tên</button>' + switchLink + '</div></div>';
    $('#tkEdit').onclick = () => { state.editingInfo = true; renderTicket(); $('#inQueue').focus(); };
    wireSwitch(); return;
  }
  el.innerHTML = '<div class="tk-num"><label class="tk-label" for="inQueue">Số trên thẻ</label>' +
    '<input id="inQueue" class="num" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="00" autocomplete="off" value="' + esc(state.info.queue) + '"></div>' +
    '<div class="tk-body"><p class="tk-title">Lấy thẻ số ở quầy bếp, nhập số trên thẻ và tên của bạn.</p>' +
    '<label class="field" for="inName">Tên của bạn <input id="inName" maxlength="40" autocomplete="given-name" placeholder="Để quán gọi khi cần" value="' + esc(state.info.name) + '"></label>' +
    '<p class="msg" id="tkMsg" hidden></p>' +
    '<div class="row"><button class="btn btn-sm" type="button" id="tkSave">Lưu</button>' + (state.editingInfo ? '' : '<span class="tk-hint">Bạn có thể xem menu trước.</span>') + '</div><div class="tk-links">' + switchLink + '</div></div>';
  wireSwitch();
  const q = $('#inQueue'), n = $('#inName');
  q.oninput = () => { q.value = q.value.replace(/\D/g, ''); state.info.queue = q.value; saveInfo(); renderChip(); };
  n.oninput = () => { state.info.name = n.value; saveInfo(); };
  $('#tkSave').onclick = () => {
    const m = $('#tkMsg');
    if (!(queueNum() > 0)) { m.textContent = ERR.MISSING_QUEUE_NUMBER; m.hidden = false; q.focus(); return; }
    if (!state.info.name.trim()) { m.textContent = ERR.MISSING_NAME; m.hidden = false; n.focus(); return; }
    state.editingInfo = false; renderTicket(); ui.toast('Đã lưu số ' + queueNum());
  };
}
$('#chip').onclick = () => {
  if (state.view !== 'menu') showView('menu');
  if (dineMode()) state.editingInfo = true;
  renderTicket();
  $('#ticket').scrollIntoView({ block: 'center' });
  const f = $('#inQueue') || $('#inName'); if (f) f.focus({ preventScroll: true });
};

/* ---------- Menu ---------- */
const countInCart = id => state.cart.filter(l => l.itemId === id).reduce((s, l) => s + l.qty, 0);
function optionHint(it) { const seen = []; it.option_groups.forEach(g => { if (seen.indexOf(g.title) < 0) seen.push(g.title); }); return seen.join(' · '); }
function addBtnHtml(it) {
  const n = countInCart(it.id);
  return '<button class="add' + (n ? ' add--on' : '') + '" type="button" data-add="' + esc(it.id) + '" aria-label="Thêm ' + esc(it.name) + (n ? ', đang có ' + n + ' trong giỏ' : '') + '">' + (n ? '<span class="num">' + n + '</span>' : ICON.plus) + '</button>';
}
/* Danh mục của menu đang mở. Nếu menu này chưa có danh mục nào thì hiện toàn bộ. */
function shownCats() {
  if (GIAO) { ['#otherTop', '#otherEnd'].forEach(id => { $(id).hidden = true; }); return state.menu; } // đủ cả đồ ăn và đồ uống
  const mineCats = state.menu.filter(c => (c.station || 'bep') === state.kind);
  const hasOther = state.menu.some(c => (c.station || 'bep') === OTHER_KIND);
  const o = MENU[OTHER_KIND];
  [['#otherTop', 'Gọi ' + (OTHER_KIND === 'pha_che' ? 'đồ uống' : 'đồ ăn') + '? Xem menu ' + o.link + ' →'],
   ['#otherEnd', '<b>Xem menu ' + o.link + ' →</b><span>' + o.linkDesc + '</span>']].forEach(([id, html]) => {
    // &xem=menu: sang menu kia thì mở thẳng menu, kể cả khi đang có đơn (không bị đưa về màn hình theo dõi đơn)
    const a = $(id); a.hidden = !hasOther || !mineCats.length; a.href = 'index.html' + o.query + '&xem=menu'; a.innerHTML = html;
  });
  return mineCats.length ? mineCats : state.menu;
}
function renderMenu() {
  const cats = shownCats();
  $('.hero-name').textContent = MENU[state.kind].hero; $('#heroTag').textContent = MENU[state.kind].tag;
  $('#menuList').innerHTML = cats.map(c =>
    '<section class="cat cc-' + esc(c.color || 'vang') + '" id="cat-' + esc(c.id) + '" data-cat="' + esc(c.id) + '">' +
    '<h2 class="cat-title"><span>' + esc(c.name) + '</span></h2><ul class="items">' +
    c.items.map(it => {
      const hint = optionHint(it);
      return '<li class="item" data-item="' + esc(it.id) + '">' +
        '<button class="thumb-btn" type="button" data-open="' + esc(it.id) + '" aria-label="Xem ' + esc(it.name) + '">' + thumbHtml(it) + '</button>' +
        '<button class="item-main" type="button" data-open="' + esc(it.id) + '">' +
        '<span class="item-name">' + esc(it.name) + (it.tag ? ' <span class="tag">' + esc(it.tag) + '</span>' : '') + '</span>' +
        (it.description ? '<span class="item-desc">' + esc(it.description) + '</span>' : '') +
        (hint ? '<span class="item-opts">' + esc(hint) + '</span>' : '') + '</button>' +
        '<div class="item-side">' + (priceL(it) ? '<span class="item-price item-price--ml num"><span><small>M</small> ' + K(it.price) + '</span><span><small>L</small> ' + K(priceL(it)) + '</span></span>' : '<span class="item-price num">' + K(it.price) + '</span>') + addBtnHtml(it) + '</div></li>';
    }).join('') + '</ul></section>').join('');
  $('#tabsIn').innerHTML = cats.map((c, i) => '<button class="tab cc-' + esc(c.color || 'vang') + '" type="button" data-go="' + esc(c.id) + '"' + (i === 0 ? ' aria-current="true"' : '') + '>' + esc(c.name) + '</button>').join('');
  watchSections();
}
function refreshAddButtons() {
  $$('.item').forEach(li => { const it = state.items.get(li.dataset.item); if (it) li.querySelector('.add').outerHTML = addBtnHtml(it); });
}
$('#menuList').addEventListener('click', e => {
  const open = e.target.closest('[data-open]'), add = e.target.closest('[data-add]');
  if (open) openItem(open.dataset.open);
  if (add) quickAdd(add.dataset.add);
});
$('#tabsIn').addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (!b) return;
  const sec = document.getElementById('cat-' + b.dataset.go);
  if (sec) sec.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
});
let observer;
function watchSections() {
  if (observer) observer.disconnect();
  if (!('IntersectionObserver' in window)) return;
  observer = new IntersectionObserver(entries => entries.forEach(en => {
    if (!en.isIntersecting) return;
    $$('.tab').forEach(t => {
      const on = t.dataset.go === en.target.dataset.cat;
      t.setAttribute('aria-current', on ? 'true' : 'false');
      if (on) { const bar = $('.tabs'); bar.scrollLeft = t.offsetLeft - bar.clientWidth / 2 + t.offsetWidth / 2; }
    });
  }), { rootMargin: '-70px 0px -65% 0px' });
  $$('.cat').forEach(s => observer.observe(s));
}

/* ---------- Thêm vào giỏ ---------- */
const lineKey = l => l.itemId + '|' + l.choices.map(c => c.id).sort((a, b) => a - b).join(',') + '|' + (l.note || '');
const unitPrice = l => l.base + l.choices.reduce((s, c) => s + c.price, 0);
function addLine(line) {
  const ex = state.cart.find(l => lineKey(l) === lineKey(line));
  if (ex) ex.qty = Math.min(50, ex.qty + line.qty); else state.cart.push(line);
  saveCart(); refreshAddButtons(); renderCartBar();
}
/* ---------- Hình minh hoạ lượng đường / lượng đá (tự vẽ bằng SVG) ----------
   Gắn theo tên lựa chọn: "Không / Ít / ... bình thường" + "đường" hoặc "đá". */
const LV = (() => {
  const INK = '#3B2A24', RED = '#E2325C';
  const cube = (x, y, s) => { const h = s; // khối đường nhìn nghiêng: mặt trên, trái, phải
    const t = [x, y - s / 2, x + s, y, x, y + s / 2, x - s, y], l = [x - s, y, x, y + s / 2, x, y + s / 2 + h, x - s, y + h], r = [x + s, y, x, y + s / 2, x, y + s / 2 + h, x + s, y + h];
    const pg = (pts, f) => '<polygon points="' + pts.join(' ') + '" fill="' + f + '" stroke="' + INK + '" stroke-width="1.6" stroke-linejoin="round"/>';
    return pg(l, '#F2E4CF') + pg(r, '#E4CFB1') + pg(t, '#FFFFFF') + '<circle cx="' + (x - s / 3) + '" cy="' + (y - 1) + '" r="1.1" fill="#D9C3A2"/><circle cx="' + (x + s / 3) + '" cy="' + (y + 1) + '" r="1.1" fill="#D9C3A2"/>'; };
  const saucer = '<ellipse cx="32" cy="55" rx="25" ry="5" fill="#F3E3C8" stroke="' + INK + '" stroke-width="1.6"/>';
  const glass = inner => '<defs><clipPath id="CLIP"><polygon points="14,12 50,12 46,57 18,57"/></clipPath></defs>' +
    '<rect x="12" y="25" width="40" height="34" fill="#F2C98E" clip-path="url(#CLIP)"/>' + inner +
    '<polygon points="14,12 50,12 46,57 18,57" fill="none" stroke="' + INK + '" stroke-width="2" stroke-linejoin="round"/>' +
    '<path d="M17 25 Q32 22 47 25" fill="none" stroke="#D99A4E" stroke-width="1.6"/><path d="M20 18 L20 50" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity=".7"/>';
  const ice = (x, y, a) => '<rect x="' + (x - 6) + '" y="' + (y - 6) + '" width="12" height="12" rx="3" transform="rotate(' + a + ' ' + x + ' ' + y + ')" fill="#DDF1FB" stroke="#5FA8D3" stroke-width="1.6"/>' +
    '<path d="M' + (x - 3) + ' ' + (y - 2) + ' l3 -2" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" transform="rotate(' + a + ' ' + x + ' ' + y + ')"/>';
  const no = '<circle cx="32" cy="34" r="22" fill="none" stroke="' + RED + '" stroke-width="3.5"/><path d="M16.5 49.5 L47.5 18.5" stroke="' + RED + '" stroke-width="3.5" stroke-linecap="round"/>';
  const svg = (inner, id) => '<svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">' + inner.replace(/CLIP/g, 'clip-' + id) + '</svg>';
  return {
    duong0: svg(saucer + cube(32, 36, 11) + no, 'd0'),
    duong1: svg(saucer + cube(32, 36, 11), 'd1'),
    duong2: svg(saucer + cube(21, 41, 9) + cube(43, 41, 9) + cube(32, 27, 9), 'd2'),
    da0: svg(glass('<circle cx="28" cy="44" r="1.6" fill="#FFF6E6"/><circle cx="37" cy="36" r="1.2" fill="#FFF6E6"/><circle cx="33" cy="50" r="1" fill="#FFF6E6"/>'), 'a0'),
    da1: svg(glass(ice(33, 30, 12)), 'a1'),
    da2: svg(glass(ice(25, 29, -10) + ice(38, 30, 14) + ice(31, 42, 4) + ice(40, 47, -18)), 'a2')
  };
})();
function levelIcon(name) {
  const n = String(name || '').toLowerCase();
  const kind = /đường/.test(n) ? 'duong' : /(^|\s)đá(\s|$)/.test(n) ? 'da' : null;
  if (!kind) return null;
  return LV[kind + (/không/.test(n) ? 0 : /\bít\b|^ít|\sít/.test(n) ? 1 : 2)];
}
function quickAdd(id) {
  if (GIAO && state.staff === false) { ui.toast('Cần đăng nhập ở trang Quản lý trước'); return; }
  if (!dineMode()) { needDine(() => quickAdd(id)); return; }
  const it = state.items.get(id); if (!it) return;
  const choices = []; let ok = true;
  it.option_groups.forEach(g => {
    const defs = g.choices.filter(c => c.default); if (defs.length < g.min) ok = false;
    defs.forEach(c => choices.push({ id: c.id, name: c.name, price: c.price, group: g.title }));
  });
  if (!ok) { openItem(id); return; }
  addLine({ itemId: it.id, name: it.name, base: it.price, choices, qty: 1, note: '' });
  ui.toast('Đã thêm ' + it.name + (choices.length ? ' (' + choices.map(c => c.name).join(', ') + ')' : ''));
}
function openItem(id) {
  if (!dineMode()) { needDine(() => openItem(id)); return; }
  const it = state.items.get(id); if (!it) return;
  const cat = state.itemCat.get(id);
  const sel = new Map(); it.option_groups.forEach(g => sel.set(g.id, new Set(g.choices.filter(c => c.default).map(c => c.id))));
  let qty = 1;
  const total = () => { let x = 0; it.option_groups.forEach(g => g.choices.forEach(c => { if (sel.get(g.id).has(c.id)) x += c.price; })); return (it.price + x) * qty; };
  const groupHtml = g => {
    const single = g.max === 1, type = (g.min === 1 && g.max === 1) ? 'radio' : 'checkbox';
    const rule = g.min > 0 ? '<span class="og-rule og-rule--req">Bắt buộc</span>' : (g.max > 1 ? '<span class="og-rule">Chọn tối đa ' + g.max + '</span>' : '<span class="og-rule">Không bắt buộc</span>');
    const input = c => '<input type="' + type + '" name="g' + g.id + '" value="' + c.id + '"' + (sel.get(g.id).has(c.id) ? ' checked' : '') + (single ? ' data-single="1"' : '') + '>';
    const price = c => '<span class="choice-price num">' + (c.price ? '+' + K(c.price) : '') + '</span>';
    // Nhóm mà mọi lựa chọn đều có hình (lượng đường, lượng đá) hiện thành ô có hình
    const tiles = g.choices.length > 1 && g.choices.length <= 4 && g.choices.every(c => levelIcon(c.name));
    // Nhóm size: 2 ô có hình ly, hiện giá đầy đủ của từng size
    if (sizeGroup({ option_groups: [g] })) return '<fieldset class="og og--tiles og--size" data-g="' + g.id + '"><legend>Chọn size</legend><div class="tiles tiles--2">' +

const pad2 = n => String(n).padStart(2, '0');
function defaultDeliverTime() { const d = new Date(Date.now() + 30 * 60e3); d.setMinutes(Math.ceil(d.getMinutes() / 5) * 5, 0, 0); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }

  if (d < Date.now() - 3 * 3600e3) d.setDate(d.getDate() + 1); // giờ đã qua lâu: hiểu là ngày mai
  return d.toISOString();
}

async function sendGiao(sh) {
  const g = state.giao, msg = $('#cMsg', sh), btn = $('#cSend', sh); msg.hidden = true;
  if (!g.name.trim()) { $('#fName', sh).classList.add('invalid'); msg.textContent = 'Nhập tên khách.'; msg.hidden = false; $('#gName', sh).focus(); return; }
  if (!g.address.trim()) { $('#fAddr', sh).classList.add('invalid'); msg.textContent = ERR.MISSING_ADDRESS; msg.hidden = false; $('#gAddr', sh).focus(); return; }
  btn.disabled = true; btn.textContent = 'Đang tạo…';
  try {
    const res = await api.placeOrder({
      queue: null, dine: 'giao_hang', name: g.name.trim(), phone: g.phone.trim(), address: g.address.trim(), deliverAt: deliverIso(g.time), note: state.cartNote.trim(),
      items: state.cart.map(l => ({ menu_item_id: l.itemId, qty: l.qty, note: l.note || null, choice_ids: l.choices.map(c => c.id) }))
    });
    let paidMsg = '';
    if (g.paid) { try { await api.completePayment(res.order_id, 'chuyen_khoan'); paidMsg = ', đã ghi nhận chuyển khoản'; } catch (e) { paidMsg = '. Chưa ghi nhận được tiền, thu ở màn hình bếp'; } }
    const who = g.name.trim();
    state.cart = []; state.cartNote = ''; saveCart(); refreshAddButtons(); renderCartBar();
    state.giao = { name: '', phone: '', address: '', time: '', paid: false };
    ui.close(); ui.toast('Đã tạo đơn giao hàng cho ' + who + ' · ' + vnd(res.total) + paidMsg);
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Tạo đơn giao hàng';
    msg.textContent = errText(e); msg.hidden = false; msg.scrollIntoView({ block: 'nearest' });
    if (e.code === 'ITEM_UNAVAILABLE' || e.code === 'OPTION_INVALID') loadMenu().then(() => { const l = $('#cLines', sh); if (l) { l.innerHTML = '<p class="small muted">Giỏ đã được cập nhật theo menu mới.</p>'; } });
  }
}
async function sendOrder(sh, confirm) {
  const msg = $('#cMsg', sh), dup = $('#cDup', sh), btn = $('#cSend', sh);
  msg.hidden = true; dup.hidden = true;
  if (!dineMode()) { $('#fDine', sh).classList.add('invalid'); msg.textContent = 'Bạn ăn tại quán hay mang về? Chọn một ô ở trên nhé.'; msg.hidden = false; msg.scrollIntoView({ block: 'nearest' }); return; }
  if (!isTake() && !(queueNum() > 0)) { $('#fQueue', sh).classList.add('invalid'); msg.textContent = ERR.MISSING_QUEUE_NUMBER; msg.hidden = false; $('#cQueue', sh).focus(); msg.scrollIntoView({ block: 'nearest' }); return; }
  if (!state.info.name.trim()) { $('#fName', sh).classList.add('invalid'); msg.textContent = ERR.MISSING_NAME; msg.hidden = false; $('#cName', sh).focus(); msg.scrollIntoView({ block: 'nearest' }); return; }
  const mine = !isTake() && state.orders.some(o => !o.paid && o.dine !== 'mang_ve' && o.queue === queueNum());
  btn.disabled = true; btn.textContent = 'Đang gửi…';
  try {
    const res = await api.placeOrder({
      queue: isTake() ? null : queueNum(), dine: dineMode(), name: state.info.name.trim(), phone: state.info.phone.trim(), note: state.cartNote.trim(), confirm: confirm || mine,
      items: state.cart.map(l => ({ menu_item_id: l.itemId, qty: l.qty, note: l.note || null, choice_ids: l.choices.map(c => c.id) }))
    });
    state.orders.unshift({ token: res.access_token, id: res.order_id, queue: isTake() ? null : queueNum(), dine: dineMode(), name: state.info.name.trim(), paid: false }); saveOrders();
    state.cart = []; state.cartNote = ''; saveCart(); refreshAddButtons();
    state.editingInfo = false; renderTicket();
    ui.close(); showView('status'); startPolling(); ui.toast('Đã gửi đơn cho quán');
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Gửi đơn cho quán';
    if (e.code === 'DUPLICATE_QUEUE') {
      dup.innerHTML = '<p><b>' + esc(e.hint || 'Số này đang có đơn chưa thanh toán') + '.</b> Nếu bạn ngồi cùng hoặc gọi thêm món, bấm “Vẫn gửi”. Nếu nhập nhầm, hãy sửa lại số.</p>' +
        '<div class="row"><button class="btn btn-sm" type="button" id="dupYes">Vẫn gửi</button><button class="btn btn-sm btn-line" type="button" id="dupNo">Sửa số</button></div>';

    }

    if (e.code === 'ITEM_UNAVAILABLE' || e.code === 'OPTION_INVALID') {
      const gone = await loadMenu();
      if (gone && gone.length) msg.textContent = 'Món vừa hết, đã bỏ khỏi giỏ: ' + gone.join(', ') + '. Kiểm tra lại giỏ rồi gửi.';
      const l = $('#cLines', sh); if (l) ui.close(), openCart();
    }
  }
}

/* ---------- Trạng thái đơn ---------- */
const activeOrders = () => state.orders.filter(o => !o.paid);
const PART = { bep: 'Bếp', pha_che: 'Quầy pha chế' };
function partText(p) {
  if (p.status === 'cho_nhan') return 'Chờ nhận';
  if (p.status === 'da_ra_mon') return 'Đã xong';
  const left = p.estimated_ready_at ? Math.ceil((new Date(p.estimated_ready_at) - Date.now()) / 60000) : null;
  return left != null && left > 0 ? 'Đang làm · còn ' + left + "'" : 'Sắp xong';
}
/* Đơn có cả đồ ăn và đồ uống: hiện tiến độ riêng của bếp và quầy pha chế */
function partsHtml(d) {

  return '<ul class="parts">' + ps.map(p => {
    const n = (d.items || []).filter(i => (i.station || 'bep') === p.station).reduce((s, i) => s + i.qty, 0);

}
function statusText(d) {
  const who = (d.stations || []).length === 1 && d.stations[0].station === 'pha_che' ? 'Quầy pha chế' : (d.stations || []).length > 1 ? 'Quán' : 'Bếp';
  if (d.status === 'cho_nhan') return { title: 'Đang chờ ' + (who === 'Quán' ? 'quán' : who.toLowerCase()) + ' nhận đơn', sub: d.orders_ahead > 0 ? '<p class="eta"><b class="num">' + d.orders_ahead + '</b>đơn trước bạn</p>' : '<p>Đơn sẽ được nhận trong giây lát.</p>' };
  if (d.status === 'dang_lam') {
    const left = d.estimated_ready_at ? Math.ceil((new Date(d.estimated_ready_at) - Date.now()) / 60000) : null;
    if (left !== null && left > 0) return { title: who + ' đang làm món', sub: '<p class="eta">Còn khoảng <b class="num">' + left + '</b>phút</p><p>Dự kiến xong lúc <span class="num">' + hhmm(d.estimated_ready_at) + '</span></p>' };
    return { title: 'Sắp xong rồi', sub: '<p>Món đang được hoàn thiện, bạn đợi thêm chút nhé.</p>' };
  }
  if (d.dine_type === 'mang_ve') return { title: 'Món đã xong', sub: '<p>Mời bạn ra quầy nhận món mang về.</p>' };
  return { title: 'Món đã ra', sub: '<p>Nhân viên đang mang tới chỗ có thẻ số ' + esc(d.queue_number) + '.</p>' };
}
function orderCard(o) {

    (d.paid_amount != null ? '<p class="oc-paid">' + (d.paid_amount >= d.total ? 'Đã thanh toán trước ' + vnd(d.paid_amount) : 'Đã trả ' + vnd(d.paid_amount) + ' · còn ' + vnd(d.total - d.paid_amount) + ' do thêm món') + '</p>' : '') +
    '<details class="oc-items"><summary>' + count + ' món · <span class="num">' + vnd(d.total) + '</span> · ' + esc(d.customer_name) + '</summary><ul>' +
    items.map(i => '<li><span>' + i.qty + ' × ' + esc(i.name) + '</span><span class="num">' + vnd(i.price * i.qty) + '</span>' +
      ((i.options && i.options.length) || i.note ? '<span class="line-sub">' + esc((i.options || []).map(x => x.choice).concat(i.note ? ['Ghi chú: ' + i.note] : []).join(' · ')) + '</span>' : '') + '</li>').join('') +
    '</ul></details>' +
    (d.note ? '<p class="oc-note"><b>Ghi chú:</b> ' + esc(d.note) + '</p>' : '') +
    '<button class="btn btn-soft btn-block" type="button" data-call="' + esc(o.token) + '"' + (d.has_open_call ? ' disabled' : '') + '>' + (d.has_open_call ? 'Đã gọi, nhân viên đang tới' : 'Gọi nhân viên') + '</button></article>';
}
function renderStatus() {
  if (state.view !== 'status') return;
  $('#statusIn').innerHTML = '<div class="st-head"><h1>Đơn của bạn</h1><button class="btn btn-sm" type="button" id="stMore">Gọi thêm món</button></div>' +
    (state.orders.length ? state.orders.map(orderCard).join('') : '<p class="empty">Bạn chưa có đơn nào.</p>') +
    '<p class="st-foot">Trang tự cập nhật. Tắt màn hình rồi mở lại vẫn thấy đơn.</p>';
}
$('#statusIn').addEventListener('click', async e => {
  if (e.target.closest('#stMore')) { showView('menu'); return; }
  const call = e.target.closest('[data-call]');
  if (call) { call.disabled = true; call.textContent = 'Đang gọi…'; try { await api.callStaff(call.dataset.call); ui.toast('Đã gọi nhân viên'); } catch (err) { ui.toast(errText(err)); } poll(); return; }
  const dis = e.target.closest('[data-dismiss]');
  if (dis) { state.orders = state.orders.filter(o => o.token !== dis.dataset.dismiss); saveOrders(); renderStatus(); if (!state.orders.length) showView('menu'); }
});
function renderBanner() {
  const act = activeOrders(), el = $('#banner');
  if (!act.length || state.view !== 'menu') { el.innerHTML = ''; return; }
  const d = state.orderData[act[0].token];
  const label = !d ? 'Đơn ' + orderLabel(act[0]) : (d.dine_type === 'mang_ve' ? 'Mang về' : 'Số ' + d.queue_number) + ' · ' + ({ cho_nhan: 'Chờ bếp nhận', dang_lam: 'Bếp đang làm', da_ra_mon: 'Món đã ra' }[d.status]);
  el.innerHTML = '<button class="banner" type="button" id="toStatus"><span>' + esc(label) + (act.length > 1 ? ' (+' + (act.length - 1) + ' đơn)' : '') + '</span><span>Xem đơn →</span></button>';
  $('#toStatus').onclick = () => showView('status');
}
let pollTimer = null, polling = false;
/* Nghe tín hiệu của từng đơn đang mở: bếp/pha chế bấm là khách thấy ngay, không phải chờ lần hỏi 15 giây */
const watchers = new Map();
let pollSoon = null, pollAgain = false;
const pollNow = () => { clearTimeout(pollSoon); pollSoon = setTimeout(poll, 250); }; // gộp nhiều tín hiệu sát nhau thành 1 lần hỏi
function syncWatchers() {
  const act = new Set(activeOrders().filter(o => o.id).map(o => o.id));
  act.forEach(id => { if (!watchers.has(id)) { watchers.set(id, null); api.watchOrder(id, pollNow).then(stop => { if (watchers.has(id)) watchers.set(id, stop); else stop(); }).catch(() => watchers.delete(id)); } });
  [...watchers.keys()].forEach(id => { if (!act.has(id)) { const stop = watchers.get(id); watchers.delete(id); if (stop) stop(); } });
}
async function poll() {
  if (polling) { pollAgain = true; return; } polling = true; pollAgain = false;
  try {
    await Promise.all(activeOrders().map(async o => {
      try { const d = await api.getMyOrder(o.token); if (d === null) { o.paid = true; delete state.orderData[o.token]; } else state.orderData[o.token] = d; }
      catch (e) { /* mạng chập chờn: giữ trạng thái cũ */ }
    }));
    saveOrders();
  } finally { polling = false; }
  renderStatus(); renderBanner(); syncWatchers();
  if (!activeOrders().length) clearInterval(pollTimer);
  if (pollAgain) pollNow();
}
function startPolling() { syncWatchers(); clearInterval(pollTimer); poll(); pollTimer = setInterval(poll, (DEMO ? 2 : CONFIG.POLL_SECONDS) * 1000); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && activeOrders().length) startPolling(); });
setInterval(() => { if (state.view === 'status') renderStatus(); }, 30000);

/* ---------- Khởi động ---------- */
/* Tải menu. Món hết / tuỳ chọn hết đang nằm trong giỏ thì bỏ ra và báo tên. Trả về danh sách tên món bị bỏ. */
let lastMenuAt = 0, menuReloadT = null;
async function loadMenu() {
  try {
    state.menu = await api.getMenu() || []; lastMenuAt = Date.now();
    state.items = new Map(); state.itemCat = new Map();
    state.menu.forEach(c => c.items.forEach(it => { state.items.set(it.id, it); state.itemCat.set(it.id, c); }));
    const ok = l => { const it = state.items.get(l.itemId); if (!it) return false; const ids = new Set(); it.option_groups.forEach(g => g.choices.forEach(c => ids.add(c.id))); return l.choices.every(c => ids.has(c.id)); };
    const gone = state.cart.filter(l => !ok(l)).map(l => l.name);
    state.cart.filter(ok).forEach(l => { const it = state.items.get(l.itemId); it.option_groups.forEach(g => {
      if (g.min > 0 && !l.choices.some(c => g.choices.some(x => x.id === c.id))) g.choices.filter(c => c.default).forEach(c => { l.choices.push({ id: c.id, name: c.name, price: c.price, group: g.title }); });
    }); });
    if (gone.length) { state.cart = state.cart.filter(ok); saveCart(); ui.toast('Vừa hết, đã bỏ khỏi giỏ: ' + [...new Set(gone)].join(', ')); }
    renderMenu(); renderCartBar();
    return gone;
  } catch (e) { if (!state.menu.length) $('#menuList').innerHTML = '<p class="msg">Không tải được menu. Kiểm tra mạng rồi tải lại trang.</p>'; return []; }
}
/* Chủ quán gạt "Hết món" / đổi giá: cơ sở dữ liệu báo tín hiệu, trang tải lại menu (lệch vài giây để 50 máy không tải cùng lúc) */
api.watchMenu(() => { clearTimeout(menuReloadT); menuReloadT = setTimeout(loadMenu, 500 + Math.random() * 2000); }).catch(() => { /* vẫn còn tải lại khi mở lại màn hình */ });
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastMenuAt > 60e3) loadMenu(); });
$('#demoNote').hidden = !DEMO;
ui.init(); renderTicket();
if (GIAO) api.staffSession().then(e => { state.staff = e || false; renderTicket(); });
const wantMenu = BN.PARAMS.get('xem') === 'menu';
if (wantMenu) { try { const u = new URL(location.href); u.searchParams.delete('xem'); history.replaceState(null, '', u); } catch (e) { /* bỏ qua */ } }
loadMenu().then(() => { if (activeOrders().length) { showView(wantMenu ? 'menu' : 'status'); startPolling(); } else showView('menu'); });
})();
</script>
